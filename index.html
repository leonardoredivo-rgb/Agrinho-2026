<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Quiz Agrinho 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="tela-home">
        <h1>Bem-vindo ao Quiz!</h1>
        
        <form>
            <p>Digite seu nome abaixo:</p>
            <input type="text" id="nome" placeholder="Seu nome aqui...">
            <button type="button" id="btn-enviar">Enviar</button>
        </form>

        <p id="mensagem">
            Olá! <br>
            Clique no botão ao lado para começar.
        </p>

        <p>
            <button type="button" id="btn-comecar">Começar o quiz</button>
        </p>
    </div>

    <div id="tela-pergunta" class="escondido">
        <h2>Questão 1</h2>
        <p>Olá, <strong id="nome-jogador"></strong>! Responda à pergunta abaixo:</p>
        
        <div>
            <h3>O que é fundamental para aumentar a eficiência e conservar recursos do agro?</h3>
            
            <p><button type="button">A) Magia</button></p>
            <p><button type="button">B) Celular</button></p>
            <p><button type="button">C) Futebol</button></p>
            <p><button type="button">D) uso de tecnologias como agricultura de precisão e integração lavoura-pecuária-floresta</button></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
